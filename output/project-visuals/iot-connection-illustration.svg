<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">ESP32 device, cloud backend and companion app</title>
<desc id="desc">Conceptual illustration of an ESP32-connected temperature probe and a mobile app communicating through Cloud Functions. The lower dashed wireless path represents local Wi-Fi setup. Device appearance and app display are illustrative.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#c8102e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="960" height="640" fill="#ffffff"/>
<!-- Cloud service, above the two endpoints. -->
<g stroke="#22262b" stroke-width="4" fill="white" stroke-linejoin="round" stroke-linecap="round">
 <path d="M444 160H521C540 160 551 147 551 131C551 114 538 102 522 102C516 80 500 68 480 68C455 68 437 85 434 109C414 109 401 120 401 136C401 151 414 160 430 160Z"/>
</g>
<path d="M463 119L451 131L463 143M497 119L509 131L497 143M486 117L475 145" stroke="#c8102e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="480" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#555b63">Cloud Functions</text>
<!-- Two explicit paths, rather than a decorative chain of technology boxes. -->
<path d="M245 258V149Q245 131 263 131H374" stroke="#c8102e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M580 131H695Q713 131 713 149V239" stroke="#c8102e" stroke-width="3" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<!-- Generic controller and wired temperature probe. -->
<g stroke="#22262b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
 <rect x="148" y="279" width="194" height="150" rx="12" fill="#f2f3f4"/>
 <rect x="208" y="307" width="75" height="75" rx="3" fill="#ffffff"/>
 <path d="M220 298V307M237 298V307M254 298V307M271 298V307M220 382V391M237 382V391M254 382V391M271 382V391M199 320H208M199 337H208M199 354H208M199 371H208M283 320H292M283 337H292M283 354H292M283 371H292" stroke-width="3"/>
 <path d="M148 355H122Q105 355 105 372V459Q105 479 126 479H164" fill="none"/>
 <path d="M166 479H247" stroke-width="9"/>
 <path d="M247 479H283" stroke-width="4"/>
</g>
<circle cx="316" cy="406" r="5" fill="#c8102e"/>
<text x="245" y="351" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#22262b">ESP32</text>
<!-- App, large enough for the temperature view to read as a phone at small sizes. -->
<g stroke="#22262b" stroke-width="4" stroke-linejoin="round">
 <rect x="634" y="261" width="158" height="246" rx="23" fill="#ffffff"/>
 <path d="M686 277H741" stroke-linecap="round"/>
</g>
<path d="M655 307H771" stroke="#e3e5e7" stroke-width="2"/>
<g stroke="#c8102e" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
 <path d="M707 336V358A10 10 0 1 0 719 358V336A6 6 0 0 0 707 336Z"/>
 <path d="M713 344V365"/>
</g>
<text x="713" y="415" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="37" fill="#22262b">72°</text>
<path d="M658 462H767" stroke="#e3e5e7" stroke-width="2"/>
<path d="M658 450L678 449L690 440L704 443L718 430L737 432L752 425L767 426" stroke="#c8102e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M692 491H735" stroke="#22262b" stroke-width="3" stroke-linecap="round"/>
<!-- Local wireless setup: quieter than the cloud connection. -->
<path d="M365 398H425M535 398H608" stroke="#a9afb6" stroke-width="2" stroke-dasharray="5 8" fill="none"/>
<g stroke="#777e87" stroke-width="3" stroke-linecap="round" fill="none">
 <path d="M447 383Q480 354 513 383M458 395Q480 376 502 395M469 407Q480 398 491 407"/>
</g>
<circle cx="480" cy="419" r="3.5" fill="#777e87"/>
<text x="245" y="558" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#555b63">ESP32</text>
<text x="713" y="558" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#555b63">iOS / Android</text>
</svg>
